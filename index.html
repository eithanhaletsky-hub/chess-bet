<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הימורי שחמט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a sports-betting app at night: punchy, bright, playful, for a school chess tournament
   IDEA: the live odds board of a sports app, with chess pieces as icons and badges
   PICTURE: the featured match card (win-probability bar and big odds buttons), then the knockout tree and charts
   COLOUR and TYPE: deep night navy, neon lime for action, cyan as the second side, hot red for losses; Rubik throughout
   LAYOUT: sticky top bar with balance, bottom tab bar, slip docked above it, one column of cards up to 760px */
:root{color-scheme:dark;--bg:#0a0e15;--s1:#111824;--s2:#18212f;--line:#243044;--ink:#eef3fb;--mute:#8b99ae;--lime:#c6ff3d;--cyan:#3de0ff;--red:#ff4d6d}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;padding-bottom:170px;background:radial-gradient(900px 420px at 85% -8%,#1b2b0c 0,transparent 65%),radial-gradient(800px 380px at 0 0,#0b2634 0,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:22px;font-weight:900}h2{font-size:22px;font-weight:800}h4{font-size:13px;color:var(--mute);font-weight:500;margin:14px 0 6px}
small,.s{font-size:13px;color:var(--mute)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor}
.top{position:sticky;top:0;z-index:8;background:#0a0e15e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:8px;margin-inline-end:auto}.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--lime);color:#0a0e15;font-size:22px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
select{min-height:40px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--s2);max-width:130px}
.ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--mute);text-decoration:none;border:0;background:none;cursor:pointer}.ic.on{color:var(--lime)}
main{max-width:760px;margin:0 auto;padding:16px 14px;display:grid;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero{background:linear-gradient(160deg,#16220f 0,var(--s1) 45%,#0d1f2a 100%);border-color:#3a5a12;box-shadow:0 0 0 1px #c6ff3d22,0 18px 50px -20px #c6ff3d55}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sb{justify-content:space-between}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);white-space:nowrap;font-weight:500}
.tag.lime{background:var(--lime);color:#0a0e15;border:0;font-weight:800}
.live{color:#fff;background:var(--red);border:0;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.2}}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:16px 0 12px;text-align:center}
.pl{display:grid;justify-items:center;gap:4px}.pl b{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hero .pl b{font-size:26px}
.av{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;font-size:28px;line-height:1;background:#eef3fb;color:#0a0e15;box-shadow:0 0 0 3px var(--s1),0 0 0 5px var(--lime)}
.av.k{background:#05070b;color:#eef3fb;box-shadow:0 0 0 3px var(--s1),0 0 0 5px var(--cyan)}
.vs{font-weight:900;font-size:13px;color:var(--mute);padding:6px 8px;border-radius:8px;background:var(--s2)}
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}.pbar i:nth-child(1){background:var(--lime)}.pbar i:nth-child(2){background:#55627a}.pbar i:nth-child(3){background:var(--cyan)}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.odds.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:480px){.odds.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ob{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--s2);cursor:pointer;transition:transform .1s}
.ob small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ob b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ob:hover{border-color:#3a4a62}.ob:active{transform:scale(.97)}
.ob.sel{background:var(--lime);border-color:var(--lime);box-shadow:0 0 18px #c6ff3d66}.ob.sel small,.ob.sel b{color:#0a0e15}
details summary{cursor:pointer;margin-top:12px;color:var(--cyan);font-weight:500;min-height:32px;list-style:none}details summary::before{content:"+ "}details[open] summary::before{content:"− "}
.hs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-top:8px}.hs .ob{flex:0 0 110px}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:0;background:var(--lime);color:#0a0e15;font-weight:800;cursor:pointer}
.btn.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}.btn.r{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
input,select.f{min-height:44px;font-size:16px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--s2);max-width:none}
textarea{width:100%;min-height:90px;font:inherit;font-size:14px;color:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--s2)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:start}th{font-size:13px;color:var(--mute);font-weight:500}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--lime)}.dn{color:var(--red)}
.dot{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;color:#0a0e15;flex:none}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:9;background:#0d121bf2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav a{display:grid;justify-items:center;gap:2px;padding:8px 0 10px;color:var(--mute);text-decoration:none;font-size:13px;position:relative}
.nav a.on{color:var(--lime)}.nav a.on svg{filter:drop-shadow(0 0 6px #c6ff3d99)}
.nav a .nt{position:absolute;top:6px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red)}
#slip{position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:10;display:none;padding:0 10px}
#slip.on{display:block}
#slip .in{max-width:740px;margin:0 auto;background:#151e2c;border:1px solid #3a5a12;border-radius:18px 18px 14px 14px;box-shadow:0 -10px 40px #000a,0 0 30px #c6ff3d22;overflow:hidden}
.sbar{width:100%;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 14px;border:0;background:none;cursor:pointer;font-weight:800}
.sbar .cnt{display:grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--lime);color:#0a0e15}
.sbar .od{margin-inline-start:auto;color:var(--lime);font-variant-numeric:tabular-nums}
.sbody{padding:0 14px 14px;display:grid;gap:10px;max-height:58vh;overflow-y:auto}
.leg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--s2)}.leg div{flex:1}.leg b{font-variant-numeric:tabular-nums;color:var(--lime)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:#243044;cursor:pointer;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:700;color:var(--mute)}.seg button.on{background:var(--ink);color:#0a0e15}
.qa{display:flex;gap:6px;flex-wrap:wrap}.qa button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}
.pay{font-size:26px;font-weight:900;color:var(--lime);white-space:nowrap;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}.tile b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{position:relative;height:260px;margin-top:12px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:#05070bf0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:none;white-space:nowrap;z-index:2}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:12px;height:3px;border-radius:2px}
.bars{display:grid;gap:10px;margin-top:10px}.br{display:grid;gap:4px}.br .t{height:10px;border-radius:99px;background:var(--s2);overflow:hidden}.br .t i{display:block;height:100%;border-radius:99px;background:var(--cyan)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.bd{padding:12px;border-radius:14px;background:var(--s2);border:1px solid var(--line);opacity:.4;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:#4d6f15;background:linear-gradient(160deg,#1d2b0e,var(--s2))}
.bd span{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#0a0e15;font-size:26px;color:var(--lime);margin-bottom:6px}
.bd b{display:block;font-size:15px}
.big{font-size:52px;font-weight:900;line-height:1;color:var(--lime);text-shadow:0 0 24px #c6ff3d55;font-variant-numeric:tabular-nums;white-space:nowrap}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod>div{text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:grid;justify-items:center;gap:4px}
.pod>div:nth-child(2){padding-block:24px;border-color:#4d6f15;box-shadow:0 0 30px -10px #c6ff3d88}
.pod em{font-style:normal;font-size:30px;font-weight:900;color:var(--lime)}.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree{display:flex;gap:16px;overflow-x:auto;padding:4px 0 10px}
.col{flex:0 0 180px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}.col h3{font-size:13px;color:var(--cyan);font-weight:700}
.m{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--s2)}
.m div{display:flex;gap:6px;align-items:center;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m div+div{border-top:1px solid var(--line)}.m .w{font-weight:800;color:var(--lime)}.m .l{color:var(--mute);text-decoration:line-through}
.m p{margin:0;padding:4px 10px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.erow{display:grid;grid-template-columns:20px minmax(0,1fr) 36px 20px minmax(0,1fr) 36px;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--s2)}
@media(max-width:520px){.erow{grid-template-columns:20px minmax(0,1fr) 36px}}
.prow2{display:grid;grid-template-columns:20px minmax(0,1fr) 20px minmax(0,1fr);gap:6px;align-items:center}
tr.q td:first-child{box-shadow:inset -3px 0 0 var(--lime);color:var(--lime);font-weight:800}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) 96px 44px;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.grid2 label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.ov{position:fixed;inset:0;z-index:20;background:#000b;display:none;place-items:center;padding:14px}.ov.on{display:grid}
.ov .card{width:min(460px,100%);display:grid;gap:12px;max-height:88vh;overflow-y:auto}
#toast{position:fixed;top:66px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;z-index:30;background:var(--lime);color:#0a0e15;padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 0 30px #c6ff3d66}
#toast.on{opacity:1}#toast.bad{background:var(--red);color:#fff;box-shadow:none}#toast.gold{background:linear-gradient(90deg,#ffe14d,#c6ff3d);font-size:18px}
.empty{text-align:center;padding:32px 16px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.live::before{animation:none}.ob{transition:none}}
@media(max-width:600px){.big{font-size:42px}th,td{padding:8px 4px;font-size:14px}.hero .pl b{font-size:22px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo"><b>♞</b><h1>שח־בט</h1></div>
  <select id="who" aria-label="מי מהמר עכשיו"></select>
  <button class="ic" data-act="addB" aria-label="מהמר חדש"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
  <div class="pill"><i></i><span id="bal"></span></div>
  <a class="ic" href="#admin" id="gear" aria-label="ניהול"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a>
</div></div>
<main id="view"></main>
<div id="slip"><div class="in" id="slipIn"></div></div>
<nav class="nav"><div class="in">
  <a href="#games"><svg viewBox="0 0 24 24"><path d="M13 2 5 13h6l-1 9 8-11h-6z"/></svg>משחקים</a>
  <a href="#tree"><svg viewBox="0 0 24 24"><path d="M3 5h6v4H3zM3 15h6v4H3zM9 7h3v10H9M12 12h3M15 10h6v4h-6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>טורניר</a>
  <a href="#rank"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>דירוג</a>
  <a href="#stats"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>סטטיסטיקה</a>
  <a href="#me" id="meTab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>אני</a>
</div></nav>
<div class="ov" id="ov"><div class="card" id="ovIn"></div></div>
<div id="toast" role="status"></div>
<script>
{
const KEY='chessbet-v3';
/* sharing: the admin publishes the tournament to tournament.json in the repo; everyone else loads it */
const TKEY='chessbet-gh',SKEY='chessbet-pubsig';
const PUB=['players','fmt','rounds','groups','res','closed','odds','cOdds','cfg','demo'];
const REPO=(()=>{const h=location.hostname,p=location.pathname.split('/').filter(Boolean);return h.endsWith('.github.io')?{o:h.split('.')[0],r:p[0]||h}:{o:'eithanhaletsky-hub',r:'chess-bet'}})();
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const tok=()=>lsGet(TKEY);
const friend=()=>!!S.pubAt&&!tok();
const PAL=['#c6ff3d','#3de0ff','#ff5ccf','#ffa53d','#9d7bff','#ffe14d'];
const LBL={w:{w:'לבן',d:'תיקו',b:'שחור'},m:{s:'עד 25',m:'26–45',l:'46+'},e:{mate:'מט',resign:'כניעה',time:'נגמר הזמן',draw:'תיקו'}};
const TL={w:'תוצאה',m:'מהלכים',e:'סיום'};
const BASE={m:{s:3,m:2,l:2.5},e:{mate:2.5,resign:1.8,time:4}};
const FMT={ko:'נוקאאוט',league:'ליגה',swiss:'שווייצרית',groups:'בתים + נוקאאוט'};
const FD={ko:'מי שמפסיד מודח. הזוכה בגמר הוא האלוף.',league:'כולם נגד כולם. ניצחון נקודה, תיקו חצי נקודה. מי שצובר הכי הרבה נקודות זוכה.',swiss:'מספר קבוע של סיבובים. בכל סיבוב משחקים מול מי שיש לו ניקוד דומה, בלי לפגוש אותו יריב פעמיים. פטור שווה נקודה.',groups:'השחקנים מתחלקים לבתים לפי דירוג. בכל בית כולם נגד כולם, והראשונים עולים לנוקאאוט.'};
const GL=['א','ב','ג','ד'];
const BADGES=[['first','♟','הימור ראשון','ביצעת הימור ראשון'],['pro','♞','מהמר מקצוען','10 הימורים'],['streak','♝','מנחש על','3 הצלחות ברצף'],['upset','♜','צייד הפתעות','זכייה ביחס 4 ומעלה'],['combo','♛','מלך הקומבו','זכייה בקומבו של 3+'],['allin','♚','הכל או כלום','זכייה עם כל האסימונים'],['oracle','♔','אורקל','ניחשת את האלוף'],['rich','♕','טייקון','הכפלת את הקופה'],['loyal','♖','נאמן לקופה','בונוס יומי 3 ימים ברצף'],['heart','♙','לב של אריה','5 הפסדים ברצף, וממשיך']];
const dstr=d=>d.toLocaleDateString('en-CA');
const today=()=>dstr(new Date()),yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const np2=n=>{let x=2;while(x<n)x*=2;return x};
function seedOrder(n){let o=[1];while(o.length<n){const m=o.length*2;o=o.flatMap(s=>[s,m+1-s])}return o}
const koTitle=n=>n===1?'גמר':n===2?'חצי גמר':n===4?'רבע גמר':n===8?'שמינית גמר':'סיבוב נוקאאוט';
const demo=()=>({v:3,pw:null,cfg:{start:1000,bonus:100},fmt:{type:'ko',swiss:4,groups:2,adv:2},players:[['נועה',1420],['איתי',1380],['מאיה',1310],['יונתן',1270],['שירה',1240],['עומר',1190],['תמר',1150],['דניאל',1100]].map(([n,r])=>({n,r})),rounds:null,groups:[],res:{},closed:{},odds:{},cOdds:{},bettors:[{id:'b1',name:'אני',c:0},{id:'b2',name:'חבר',c:1}],bets:[],tx:[],streak:{},seen:{},cur:'b1',demo:true});
function migrate(o){const s=demo();s.demo=false;s.pw=o.pw||null;s.players=(o.players||[]).map(n=>({n,r:1200}));s.res=o.res||{};for(const k in s.res)s.res[k].at=s.res[k].at||Date.now();s.closed=o.closed||{};s.swap=o.swap||{};
  s.bettors=(o.bettors||[]).map((b,i)=>({id:b.id,name:b.name,c:i}));if(!s.bettors.length)s.bettors=[{id:'b1',name:'אני',c:0}];s.cur=o.cur;
  s.bets=(o.bets||[]).map(b=>b.legs?b:{id:b.id,by:b.by,s:b.s,at:b.at,legs:[{m:b.m,t:b.t,pick:b.pick,od:b.od}]});s.seedMode=Object.keys(s.res).length?'legacy':'std';return s}
function mig3(o){const P=o.players.map(p=>p.n),n=np2(P.length),R=Math.log2(n);let slots;
  if(o.seedMode==='legacy'){const m=n/2;slots=new Array(n).fill(null);P.forEach((p,i)=>{if(i<m)slots[i*2]=p;else slots[(i-m)*2+1]=p})}else slots=seedOrder(n).map(k=>P[k-1]??null);
  const rounds=[];
  if(P.length>=2)for(let r=0;r<R;r++){const ms=[],win=[];
    for(let i=0;i<slots.length/2;i++){const a=slots[2*i],b=slots[2*i+1],id=`r${r}m${i}`;if(a==null&&b==null){win.push(null);continue}
      const sw=o.swap&&o.swap[id];let w=sw?b:a,k=sw?a:b;if(w==null){w=k;k=null}ms.push({id,w,k});
      if(k==null)win.push(w);else{const x=(o.res||{})[id];win.push(x?((x.o==='d'?x.adv:x.o)==='w'?w:k):undefined)}}
    rounds.push({id:'R'+r,title:koTitle(slots.length/2),stage:'ko',ms});if(win.includes(undefined)||win.length<2)break;slots=win}
  const ids=new Set(rounds.flatMap(r=>r.ms.map(m=>m.id)));
  const s={...o,v:3,fmt:{type:'ko',swiss:4,groups:2,adv:2},rounds,groups:[],bets:(o.bets||[]).filter(b=>b.legs.every(l=>l.m==='champ'||ids.has(l.m)))};delete s.swap;delete s.seedMode;return s}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- tournament ---------- */
const names=()=>S.players.map(p=>p.n);
const rating=n=>(S.players.find(p=>p.n===n)||{r:1200}).r;
const allM=()=>S.rounds.flatMap((r,ri)=>r.ms.map(m=>({...m,round:r,ri})));
const byId=id=>allM().find(m=>m.id===id);
const real=m=>!!m&&typeof m.k==='string';
function winnerOf(m){if(!real(m))return m.w;const x=S.res[m.id];if(!x)return undefined;if(x.o==='d')return x.adv?(x.adv==='w'?m.w:m.k):null;return x.o==='w'?m.w:m.k}
const roundDone=r=>r.ms.every(m=>!real(m)||S.res[m.id]||m.post);
const allPlayed=ms=>ms.every(m=>!real(m)||S.res[m.id]);
const hard=m=>!!(S.closed[m.id]||S.res[m.id]);
const roundStarted=r=>r.ms.some(m=>real(m)&&(S.closed[m.id]||S.res[m.id]));
const locked=m=>!!(S.closed[m.id]||S.res[m.id]||S.bets.some(b=>b.legs.some(l=>l.m===m.id)));
const curRound=()=>S.rounds.find(r=>!roundDone(r));
function standings(ns,ms){const T={};ns.forEach(n=>T[n]={n,r:rating(n),p:0,w:0,d:0,l:0,g:0,op:[]});
  for(const m of ms){if(!real(m)){if(T[m.w]&&m.round.stage==='sw')T[m.w].p+=1;continue}
    const x=S.res[m.id],a=T[m.w],b=T[m.k];if(!x||!a||!b)continue;a.g++;b.g++;a.op.push(m.k);b.op.push(m.w);
    if(x.o==='d'){a.p+=.5;b.p+=.5;a.d++;b.d++}else{const[W,L]=x.o==='w'?[a,b]:[b,a];W.p++;W.w++;L.l++}}
  const arr=Object.values(T);arr.forEach(t=>t.bh=t.op.reduce((s,o)=>s+T[o].p,0));return arr.sort((a,b)=>b.p-a.p||b.bh-a.bh||b.w-a.w||b.r-a.r)}
const grpMs=g=>allM().filter(m=>m.round.stage==='grp'&&m.g===g);
const grpDone=()=>S.fmt.type==='groups'&&S.rounds.some(r=>r.stage==='grp')&&allPlayed(allM().filter(m=>m.round.stage==='grp'));
function qualifiers(){const tb=S.groups.map((g,i)=>standings(g,grpMs(i)));const out=[];for(let p=0;p<S.fmt.adv;p++)out.push(...tb.map(t=>t[p]).filter(Boolean).sort((a,b)=>b.p-a.p||b.r-a.r).map(t=>t.n));return out}
const seeded=list=>seedOrder(np2(list.length)).map(k=>list[k-1]??null);
function koMs(slots){const ms=[];for(let i=0;i<slots.length;i+=2){let w=slots[i],k=slots[i+1]??null;if(w==null){w=k;k=null}if(w!=null)ms.push({id:uid(),w,k})}return ms}
function koRound(slots){const ms=koMs(slots);return{id:'R'+uid(),title:koTitle(ms.length),stage:'ko',ms}}
function rr(ns){const a=[...ns];if(a.length%2)a.push(null);const n=a.length,out=[];
  for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if((i===0&&r%2)||(i>0&&i%2))[x,y]=[y,x];if(x===null){x=y;y=null}if(x!==null)ms.push({id:uid(),w:x,k:y})}out.push(ms);a.splice(1,0,a.pop())}
  return out}
function swissMs(excl){const done=allM().filter(m=>m.round.stage==='sw'&&m.round!==excl);let pool=standings(names(),done).map(s=>s.n);const ms=[];
  const played=new Set(),bye=new Set(),wc={},lc={};
  done.forEach(m=>{if(!real(m)){bye.add(m.w);return}played.add(m.w+'|'+m.k);played.add(m.k+'|'+m.w);wc[m.w]=(wc[m.w]||0)+1;lc[m.w]='w';lc[m.k]='b'});
  if(pool.length%2){let i=pool.length-1;while(i>0&&bye.has(pool[i]))i--;ms.push({id:uid(),w:pool[i],k:null});pool.splice(i,1)}
  if(!done.length){const h=pool.length/2;return pool.slice(0,h).map((a,i)=>i%2?{id:uid(),w:pool[h+i],k:a}:{id:uid(),w:a,k:pool[h+i]}).concat(ms)}
  let cap=0;const bt=l=>{if(!l.length)return[];if(++cap>50000)return null;const a=l[0];for(let j=1;j<l.length;j++){if(played.has(a+'|'+l[j]))continue;const r=bt(l.filter((_,x)=>x&&x!==j));if(r)return[[a,l[j]],...r]}return null};
  const pairs=bt(pool)||pool.reduce((o,x,i)=>(i%2?o[o.length-1].push(x):o.push([x]),o),[]);
  return pairs.map(([a,b])=>{const wa=wc[a]||0,wb=wc[b]||0,aw=wa<wb||(wa===wb&&(lc[a]==='b'||lc[b]!=='b'));return{id:uid(),w:aw?a:b,k:aw?b:a}}).concat(ms)}
const swRound=()=>{const r={id:'R'+uid(),title:`סיבוב ${S.rounds.filter(r=>r.stage==='sw').length+1}`,stage:'sw',ms:[]};r.ms=swissMs(r);return r};
function mkGroups(){const k=S.fmt.groups,G=Array.from({length:k},()=>[]);S.players.slice().sort((a,b)=>b.r-a.r).forEach((p,i)=>{const row=Math.floor(i/k),c=i%k;G[row%2?k-1-c:c].push(p.n)});S.groups=G;
  const sch=G.map(g=>rr(g)),R=Math.max(...sch.map(s=>s.length)),out=[];
  for(let r=0;r<R;r++)out.push({id:'R'+uid(),title:`שלב הבתים · מחזור ${r+1}`,stage:'grp',ms:sch.flatMap((s,g)=>(s[r]||[]).map(m=>({...m,g})))});return out}
function build(){S.rounds=[];S.groups=[];S.bets=[];S.res={};S.closed={};S.odds={};S.cOdds={};slip.legs=[];
  if(S.players.length<2)return;const t=S.fmt.type;
  if(t==='ko')S.rounds.push(koRound(seeded(names())));
  else if(t==='league')rr(names()).forEach((ms,i)=>S.rounds.push({id:'R'+uid(),title:`מחזור ${i+1}`,stage:'rr',ms}));
  else if(t==='swiss')S.rounds.push(swRound());
  else S.rounds.push(...mkGroups());
  advance()}
function advance(){if(friend())return;for(let g=0;g<40;g++){const last=S.rounds[S.rounds.length-1];if(!last||!roundDone(last))return;let nr=null;
  if(last.stage==='ko'){if(last.ms.length>1)nr=koRound(last.ms.map(winnerOf))}
  else if(last.stage==='sw'){if(S.rounds.length<S.fmt.swiss)nr=swRound()}
  else if(last.stage==='grp'&&grpDone())nr=koRound(seeded(qualifiers()));
  if(!nr)return;S.rounds.push(nr)}}
function champ(){if(S.players.length<2||!S.rounds.length)return undefined;const t=S.fmt.type,last=S.rounds[S.rounds.length-1];
  if(t==='ko'||t==='groups')return last.stage==='ko'&&last.ms.length===1&&roundDone(last)?(winnerOf(last.ms[0])??undefined):undefined;
  const fin=t==='league'||S.rounds.length>=S.fmt.swiss;return fin&&S.rounds.every(roundDone)&&allPlayed(allM())?standings(names(),allM())[0].n:undefined}
function elimAt(n){for(const m of allM())if(m.round.stage==='ko'&&real(m)&&S.res[m.id]&&(m.w===n||m.k===n)&&winnerOf(m)!==n)return S.res[m.id].at;
  if(grpDone()&&!qualifiers().includes(n))return Math.max(0,...grpMsAll().map(m=>S.res[m.id].at));return null}
const grpMsAll=()=>allM().filter(m=>m.round.stage==='grp'&&real(m)&&S.res[m.id]);
const alive=()=>names().filter(n=>elimAt(n)===null);
function champLocked(){if(S.players.length<2||!S.rounds.length||champ()!==undefined)return true;const t=S.fmt.type,last=S.rounds[S.rounds.length-1];
  if(t==='ko'||t==='groups')return last.stage==='ko'&&last.ms.length===1&&roundStarted(last);
  if(t==='league')return roundStarted(last);return S.rounds.length>=S.fmt.swiss&&roundStarted(last)}
if(!Array.isArray(S.rounds))build();

/* ---------- odds ---------- */
function prob(g){const E=1/(1+10**((rating(g.k)-rating(g.w)-35)/400)),pd=.12;return[E*(1-pd),pd,(1-E)*(1-pd)]}
function auto(g){const[pw,pd,pb]=prob(g),f=p=>rnd(.92/p);return{w:{w:f(pw),d:f(pd),b:f(pb)},m:{...BASE.m},e:{...BASE.e,draw:f(pd)}}}
function oddsFor(g){const a=auto(g),o=S.odds[g.id]||{};for(const t in o)Object.assign(a[t],o[t]);return a}
function cAuto(){const al=alive(),ws=al.map(n=>10**(rating(n)/400)),sum=ws.reduce((a,b)=>a+b,0),o={};al.forEach((n,i)=>o[n]=rnd(.9*sum/ws[i]));return o}
function cOdds(){const o=cAuto();for(const n in o)if(S.cOdds[n])o[n]=S.cOdds[n];return o}
const legOdds=l=>l.m==='champ'?cOdds()[l.pick]:oddsFor(byId(l.m))[l.t][l.pick];
const legOpen=l=>{if(l.m==='champ')return!champLocked()&&alive().includes(l.pick);const m=byId(l.m);return real(m)&&!S.closed[l.m]&&!S.res[l.m]};
function legLabel(l){if(l.m==='champ')return`אלוף הטורניר: ${esc(l.pick)}`;const g=byId(l.m);if(!g)return'משחק שבוטל';
  const p=l.t==='w'?(l.pick==='w'?`${esc(g.w)} מנצח`:l.pick==='b'?`${esc(g.k)} מנצח`:'תיקו'):l.t==='m'?`${LBL.m[l.pick]} מהלכים`:`סיום ב${LBL.e[l.pick]}`;
  return`${p} <small>· ${esc(g.w)} נגד ${esc(g.k)}</small>`}

/* ---------- money ---------- */
function legRes(l){
  if(l.m==='champ'){const c=champ();if(c===undefined)return alive().includes(l.pick)?null:'lose';return c===l.pick?'win':'lose'}
  const x=S.res[l.m];if(!x)return null;
  const v=l.t==='w'?x.o:l.t==='m'?(x.mv<=25?'s':x.mv<=45?'m':'l'):x.e;return v===l.pick?'win':'lose'}
function betRes(b){const r=b.legs.map(legRes);return r.includes('lose')?'lose':r.every(x=>x==='win')?'win':null}
const tot=b=>b.legs.reduce((a,l)=>a*l.od,1);
const pay=b=>Math.round(b.s*tot(b));
function legT(l,b){let t;if(l.m==='champ'){t=champ()!==undefined?Math.max(0,...Object.values(S.res).map(x=>x.at)):elimAt(l.pick)}else t=(S.res[l.m]||{}).at;return Math.max(b.at+1,t||b.at+1)}
function settleT(b,r){const ts=b.legs.map(l=>({r:legRes(l),t:legT(l,b)}));return r==='win'?Math.max(...ts.map(x=>x.t)):Math.min(...ts.filter(x=>x.r==='lose').map(x=>x.t))}
function bal(id){let s=S.cfg.start;for(const t of S.tx)if(t.by===id)s+=t.amt;for(const b of S.bets)if(b.by===id){s-=b.s;if(betRes(b)==='win')s+=pay(b)}return s}
function earned(id){const my=S.bets.filter(b=>b.by===id),e=new Set();if(my.length)e.add('first');if(my.length>=10)e.add('pro');
  const st=my.map(b=>({b,r:betRes(b)})).filter(x=>x.r).map(x=>({...x,t:settleT(x.b,x.r)})).sort((a,b)=>a.t-b.t);let w=0,l=0;
  for(const x of st){if(x.r==='win'){w++;l=0;if(tot(x.b)>=4)e.add('upset');if(x.b.legs.length>=3)e.add('combo');if(x.b.allIn)e.add('allin');if(x.b.legs.some(g=>g.m==='champ'))e.add('oracle')}else{l++;w=0}if(w>=3)e.add('streak');if(l>=5)e.add('heart')}
  if(bal(id)>=S.cfg.start*2)e.add('rich');if((S.streak[id]||{}).best>=3)e.add('loyal');return BADGES.map(b=>b[0]).filter(k=>e.has(k))}
function checkBadges(){const msg=[];for(const b of S.bettors){const e=earned(b.id),old=S.seen[b.id]||[];const nw=e.filter(k=>!old.includes(k));S.seen[b.id]=e;nw.forEach(k=>msg.push(`${b.name}: ${BADGES.find(x=>x[0]===k)[2]}`))}return msg}
for(const b of S.bettors)if(!S.seen[b.id])S.seen[b.id]=earned(b.id);
const pubStr=()=>JSON.stringify(Object.fromEntries(PUB.map(k=>[k,S[k]])));
const b64=s=>{let x='';for(const c of new TextEncoder().encode(s))x+=String.fromCharCode(c);return btoa(x)};
let pubMsg='',pubT=null,pubBusy=false;
function setPub(m,bad){pubMsg=m;const e=$('#pubSt');if(e){e.textContent=m;e.className=bad?'dn':'s'}if(bad)toast(m,'bad')}
function schedulePub(){if(!tok())return;clearTimeout(pubT);pubT=setTimeout(()=>publish(),1500)}
async function publish(force){const t=tok();if(!t)return;const body=pubStr(),sig=hash(body);
  if(!force&&sig===lsGet(SKEY))return;if(pubBusy){schedulePub();return}pubBusy=true;setPub('מפרסם…');
  const url=`https://api.github.com/repos/${REPO.o}/${REPO.r}/contents/tournament.json`,H={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
  try{let sha;const g=await fetch(url,{headers:H,cache:'no-store'});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw g.status;
    const p=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Update tournament',content:b64(JSON.stringify({...JSON.parse(body),at:Date.now()})),sha})});
    if(!p.ok)throw p.status;lsSet(SKEY,sig);setPub('פורסם ✓ חברים יראו את זה תוך דקה־שתיים')}
  catch(e){setPub(e===401||e===403||e===404?'הטוקן לא תקין או שאין לו הרשאת כתיבה לריפו':'הפרסום נכשל. נסה "פרסם עכשיו" שוב',1)}
  pubBusy=false}
async function pull(){if(tok())return;try{const r=await fetch('tournament.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),sig=hash(t);if(sig===S.pubSig)return;const d=JSON.parse(t);

function commit(m,bad){advance();save();schedulePub();const nb=checkBadges();save();render();if(nb.length)toast('הישג חדש! '+nb.join(' · '),'gold');else if(m)toast(m,bad?'bad':'')}

/* ---------- views ---------- */
const av=(p,k)=>`<span class="av${k?' k':''}">${p}</span>`;

  return`<section class="card${hero?' hero':''}"><div class="row sb"><span class="tag">${esc(g.round.title)}${g.g!=null?' · בית '+GL[g.g]:''}</span>${g.post?'<span class="tag">נדחה</span>':hero?'<span class="tag lime">המשחק הבא</span>':''}</div>
  <div class="duel"><div class="pl">${av('♔')}<b>${esc(g.w)}</b><small>${rating(g.w)} · לבן</small></div><span class="vs">VS</span><div class="pl">${av('♚',1)}<b>${esc(g.k)}</b><small>${rating(g.k)} · שחור</small></div></div>

  <div class="row sb s" style="margin-top:4px"><span>${pct(pw)}</span><span>תיקו ${pct(pd)}</span><span>${pct(pb)}</span></div>
  <div class="odds">${ob(g.id,'w','w',o.w.w,esc(g.w))}${ob(g.id,'w','d',o.w.d,'תיקו')}${ob(g.id,'w','b',o.w.b,esc(g.k))}</div>

  <h4>כמה מהלכים יהיו?</h4><div class="odds">${['s','m','l'].map(p=>ob(g.id,'m',p,o.m[p],LBL.m[p])).join('')}</div>
  <h4>איך המשחק ייגמר?</h4><div class="odds four">${['mate','resign','time','draw'].map(p=>ob(g.id,'e',p,o.e[p],LBL.e[p])).join('')}</div></details></section>`}
function vGames(){
  if(S.players.length<2)return`<div class="card empty"><h2>עוד אין שחקנים</h2><p>המנהל מוסיף אותם דרך גלגל השיניים למעלה.</p></div>`;
  const cur=curRound(),ci=cur?S.rounds.indexOf(cur):1e9,M=allM(),live=M.filter(m=>real(m)&&!S.res[m.id]&&S.closed[m.id]),open=M.filter(m=>m.ri<=ci&&real(m)&&!S.res[m.id]&&!S.closed[m.id]).sort((a,b)=>b.ri-a.ri),byes=cur?M.filter(m=>m.round===cur&&!real(m)):[];

  cAuto:()=>{S.cOdds={};unmodal();commit('חזרנו ליחסים האוטומטיים')},
  res:d=>{const id=d.id,m=byId(id),ko=m.round.stage==='ko',o=$('#o-'+id).value,e=$('#e-'+id).value,mv=Math.floor(+$('#mv-'+id).value),adv=ko?$('#adv-'+id).value:'';
    if(!(mv>=1&&mv<=300))return err('צריך מספר מהלכים בין 1 ל־300');if(o==='d'&&e!=='draw')return err('בתיקו, גם הסיום הוא "תיקו"');
    if(o!=='d'&&e==='draw')return err('יש מנצח, אז הסיום לא תיקו');if(o==='d'&&ko&&!adv)return err('בנוקאאוט צריך לבחור מי עולה אחרי תיקו');
    S.res[id]={o,e,mv,adv:o==='d'&&ko?adv:null,at:Date.now()};S.closed[id]=true;commit('התוצאה נשמרה והזכיות חולקו')},
  undo:d=>{const m=byId(d.id),later=S.rounds.slice(m.ri+1).filter(r=>r.stage==='ko'||r.stage==='sw');
    if(later.some(roundStarted))return err('קודם בטל תוצאות בסיבובים שאחריו');
    const ids=new Set(later.flatMap(r=>r.ms.map(x=>x.id)));S.rounds=S.rounds.filter(r=>!later.includes(r));S.bets=S.bets.filter(b=>!b.legs.some(l=>ids.has(l.m)));ids.forEach(i=>{delete S.odds[i];delete S.closed[i]});
    delete S.res[m.id];ED=null;commit(later.length?'התוצאה בוטלה, והסיבובים שאחריו יזווגו מחדש':'התוצאה בוטלה')},
  fmtSave:()=>{const type=$('#fT').value,sw=Math.floor(+$('#fS').value),k=Math.floor(+$('#fG').value),adv=Math.floor(+$('#fA').value),n=S.players.length,started=Object.keys(S.res).length>0;
    if(type==='swiss'&&!(sw>=1&&sw<=Math.max(1,n-1)))return err(`בשווייצרית אפשר 1 עד ${Math.max(1,n-1)} סיבובים`);
    if(started){if(S.fmt.type!=='swiss')return err('הטורניר כבר התחיל');if(sw<S.rounds.length)return err(`כבר נוצרו ${S.rounds.length} סיבובים`);S.fmt.swiss=sw;return commit('מספר הסיבובים עודכן')}
    if(type==='groups'){if(!(k>=2&&k<=4))return err('2 עד 4 בתים');if(Math.floor(n/k)<2)return err('צריך לפחות 2 שחקנים בכל בית');if(!(adv>=1&&adv<Math.floor(n/k)))return err(`מכל בית יכולים לעלות 1 עד ${Math.floor(n/k)-1}`)}
    S.fmt={type,swiss:sw||4,groups:k||2,adv:adv||2};build();ED=null;commit(`נבנה טורניר ${FMT[type]}`)},
  edAdd:()=>{readEd();ED.ms.push({id:uid(),w:'',k:null});render()},
  edDel:d=>{readEd();ED.ms.splice(+d.i,1);render()},
  edFlip:d=>{readEd();const m=ED.ms[+d.i];if(!m.k||!m.w)return err('צריך שני שחקנים כדי להחליף צבעים');[m.w,m.k]=[m.k,m.w];render()},
  edReset:()=>{ED=null;render()},
  edAuto:()=>{const ri=S.rounds.findIndex(r=>r.id===edR),r=S.rounds[ri],prev=S.rounds[ri-1];if(r.ms.some(hard))return err('יש משחקים שכבר התחילו');
    const ids=new Set(r.ms.map(m=>m.id));S.bets=S.bets.filter(b=>!b.legs.some(l=>ids.has(l.m)));ids.forEach(i=>delete S.odds[i]);
    r.ms=r.stage==='sw'?swissMs(r):!prev?koMs(seeded(names())):prev.stage==='grp'?koMs(seeded(qualifiers())):koMs(prev.ms.map(winnerOf));ED=null;commit('זווג אוטומטית')},
  edSave:()=>{readEd();const r=S.rounds.find(x=>x.id===ED.rid);if(!r)return;const seen=new Set();
    if(!ED.ms.length)return err('צריך לפחות משחק אחד');
    for(const m of ED.ms){if(!m.w)return err('בכל משחק צריך לבחור שחקן לבן');if(m.w===m.k)return err('שחקן לא יכול לשחק נגד עצמו');for(const n of[m.w,m.k])if(n){if(seen.has(n))return err(`${n} מופיע פעמיים בסיבוב`);seen.add(n)}}
    const old=new Map(r.ms.map(m=>[m.id,m])),gi=n=>S.groups.findIndex(g=>g.includes(n));
    const nm=ED.ms.map(m=>{const o=old.get(m.id);if(o&&o.w===m.w&&(o.k||null)===(m.k||null))return o;const x={id:uid(),w:m.w,k:m.k||null};if(o&&o.post)x.post=true;
      if(r.stage==='grp'){const a=gi(x.w);if(a>=0&&(x.k==null||gi(x.k)===a))x.g=a}return x});
    const keep=new Set(nm.map(m=>m.id)),gone=r.ms.filter(m=>!keep.has(m.id)).map(m=>m.id),nb=S.bets.filter(b=>b.legs.some(l=>gone.includes(l.m))).length;
    S.bets=S.bets.filter(b=>!b.legs.some(l=>gone.includes(l.m)));gone.forEach(i=>{delete S.odds[i];delete S.closed[i]});
    r.ms=nm;ED=null;commit(nb?`הזיווגים נשמרו. ${nb} הימורים בוטלו והאסימונים הוחזרו`:'הזיווגים נשמרו')},
  post:d=>{const m=S.rounds.flatMap(r=>r.ms).find(x=>x.id===d.id);if(!m)return;m.post=!m.post;if(!m.post)delete m.post;commit(m.post?'המשחק נדחה':'הדחייה בוטלה')},
  closeRound:d=>{S.rounds[+d.ri].ms.forEach(m=>{if(real(m)&&!S.res[m.id])S.closed[m.id]=true});commit('ההימורים על כל הסיבוב נסגרו')},
  pAdd:()=>{readPD();if(PD.length>=16)return err('עד 16 שחקנים');PD.push({n:'',r:1200});render()},
  pDel:d=>{readPD();PD.splice(+d.i,1);render()},
  pSort:()=>{readPD();PD.sort((a,b)=>b.r-a.r);render()},
  pShuf:()=>{readPD();for(let i=PD.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[PD[i],PD[j]]=[PD[j],PD[i]]}render()},
  players:()=>{readPD();const l=PD.filter(p=>p.n);if(l.length<2||l.length>16)return err('צריך 2 עד 16 שחקנים');if(new Set(l.map(p=>p.n)).size!==l.length)return err('יש שם שמופיע פעמיים');
    if(l.some(p=>p.r<100||p.r>3000))return err('דירוג בין 100 ל־3000');
    const same=l.length===S.players.length&&l.every((p,i)=>p.n===S.players[i].n);if(!same&&Object.keys(S.res).length)return err('אי אפשר לשנות שמות אחרי שהתחיל');
    if(S.fmt.type==='groups'&&Math.floor(l.length/S.fmt.groups)<=S.fmt.adv){S.fmt.groups=2;S.fmt.adv=1}
    S.players=l;S.demo=false;PD=null;ED=null;if(!same)build();commit(same?'הדירוגים עודכנו':'השחקנים נשמרו, הטורניר נבנה')},
  cfg:()=>{const s=Math.floor(+$('#cfS').value),b=Math.floor(+$('#cfB').value);if(!(s>=100&&s<=100000)||!(b>=0&&b<=10000))return err('ערכים לא תקינים');S.cfg={start:s,bonus:b};commit('ההגדרות נשמרו')},
  delB:d=>{if(S.bettors.length<2)return err('צריך להשאיר לפחות מהמר אחד');const b=bettor(d.id);
    modal(`<h2>למחוק את ${esc(b.name)}?</h2><p class="s">גם ההימורים שלו יימחקו.</p><div class="row"><button class="btn r" data-act="delB2" data-id="${b.id}">מחק</button><button class="btn g" data-act="cancel">ביטול</button></div>`)},
  delB2:d=>{S.bettors=S.bettors.filter(b=>b.id!==d.id);S.bets=S.bets.filter(b=>b.by!==d.id);S.tx=S.tx.filter(t=>t.by!==d.id);unmodal();commit('המהמר נמחק')},
  copy:()=>{const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('הגיבוי הועתק'),()=>{$('#rest').value=t;toast('הגיבוי מופיע בתיבה, העתק ידנית')})}catch(e){$('#rest').value=t;toast('הגיבוי מופיע בתיבה, העתק ידנית')}},
  restore:()=>{try{let x=JSON.parse($('#rest').value);if(x.v!==3)x=x.v===2?mig3(x):mig3(migrate(x));if(!Array.isArray(x.players)||!Array.isArray(x.bets)||!x.bettors.length)throw 0;S=x;slip.legs=[];PD=null;commit('שוחזר מהגיבוי')}catch(e){err('הגיבוי לא תקין')}},
  reset:()=>modal(`<h2>איפוס הכל</h2><p class="s">כל השחקנים, המהמרים וההימורים יימחקו (הסיסמה נשארת). כדי לאשר, כתוב: איפוס</p><input id="rc"><div class="row"><button class="btn r" data-act="reset2">אפס</button><button class="btn g" data-act="cancel">ביטול</button></div>`),
  reset2:()=>{if($('#rc').value.trim()!=='איפוס')return err('צריך לכתוב "איפוס"');const pw=S.pw;S=demo();S.pw=pw;S.players=[];S.demo=false;S.bettors=[{id:'b1',name:'אני',c:0}];S.seen={b1:[]};S.fmt={type:'ko',swiss:4,groups:2,adv:2};build();PD=null;unmodal();commit('הכל אופס')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled&&A[t.dataset.act]){e.preventDefault();A[t.dataset.act](t.dataset)}});
document.addEventListener('input',e=>{if(e.target.id==='stake'){slip.stake=e.target.value;const p=e.target.selectionStart;renderSlip();const s=$('#stake');s.focus();try{s.setSelectionRange(p,p)}catch(x){}}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.id){d.open?openDet.add(d.dataset.id):openDet.delete(d.dataset.id)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')unmodal();if(e.key==='Enter'){const m={pl:'login',p2:'setpw',nb:'addB2',stake:'place',rc:'reset2',tk:'tokSave'}[e.target.id];if(m)A[m]({})}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')unmodal()});
$('#who').addEventListener('change',e=>{S.cur=e.target.value;save();render()});
document.addEventListener('change',e=>{if(e.target.id==='edSel'){edR=e.target.value;ED=null;render()}else if(e.target.classList.contains('ed')){readEd();render()}});
const route=()=>{const h=location.hash.slice(1);view=['games','tree','rank','stats','me','admin'].includes(h)?h:'games';if(view!=='admin')PD=null;render();scrollTo(0,0)};
window.addEventListener('hashchange',route);
route();
pull();setInterval(pull,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
}
</script>
</body>
</html>
